services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wasteloop
      POSTGRES_PASSWORD: wasteloop
      POSTGRES_DB: wasteloop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasteloop -d wasteloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-time setup required before this service works:
  #   ./infra/osrm/scripts/fetch_and_prepare_osm.sh
  # Until then, the backend falls back to the public OSRM demo server (see OSRM_BASE_URL in .env).
  osrm:
    image: osrm/osrm-backend
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/region.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./infra/osrm/data:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://wasteloop:wasteloop@postgres:5432/wasteloop?schema=public"
      OSRM_BASE_URL: "http://osrm:5000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  postgres-data:
